<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KAIDO Studio ｜ エージェント・オフィス</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0f1117;
  --panel:#171a24;
  --panel-2:#1e2230;
  --floor:#2b2f3d;
  --floor-2:#262a36;
  --ink:#e9ecf4;
  --ink-soft:#b3b9c9;
  --ink-mute:#727a90;
  --line:#2c313f;
  --accent:#e0b15c;
  --accent-2:#5ec8c0;
  /* role colors */
  --c-pm:#e0b15c;
  --c-design:#e07a9c;
  --c-front:#6aa6ff;
  --c-back:#7ad19a;
  --c-write:#c79bff;
  --c-qa:#ff9b6a;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1200px 700px at 70% -10%, #1c2233 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  overflow:hidden;
}

/* ============ APP SHELL ============ */
.app{
  display:grid;
  grid-template-columns:1fr 340px;
  grid-template-rows:56px 1fr;
  grid-template-areas:
    "top    top"
    "stage  side";
  height:100vh;
}

/* ---- top bar ---- */
.topbar{
  grid-area:top;
  display:flex;align-items:center;gap:16px;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#151824,#12141d);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.brand small{font-weight:500;color:var(--ink-mute);letter-spacing:.15em;font-size:11px}
.topbar .spacer{flex:1}
.status-pill{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
}
.status-pill .beat{width:8px;height:8px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2);animation:beat 1.6s infinite}
.status-pill.busy .beat{background:var(--accent);box-shadow:0 0 8px var(--accent)}
@keyframes beat{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* ============ STAGE (office floor) ============ */
.stage-wrap{grid-area:stage;position:relative;overflow:hidden}
.stage{
  position:absolute;inset:0;
  perspective:1400px;
}
.floor{
  position:absolute;
  left:6%;right:6%;top:8%;bottom:9%;
  transform:rotateX(34deg);
  transform-style:preserve-3d;
  border-radius:18px;
  background:
    repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.025) 79px 80px),
    repeating-linear-gradient(0deg,  transparent 0 79px, rgba(255,255,255,.025) 79px 80px),
    linear-gradient(160deg,var(--floor) 0%,var(--floor-2) 100%);
  box-shadow:
    0 60px 120px rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,255,255,.04),
    inset 0 40px 80px rgba(0,0,0,.25);
}
.floor::after{
  /* soft rug in the meeting zone */
  content:"";position:absolute;left:33%;top:30%;width:34%;height:40%;
  border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(224,177,92,.10), transparent 70%);
}
/* layer that holds all placed objects & agents, sharing the floor tilt */
.world{position:absolute;inset:0;transform-style:preserve-3d}

/* furniture */
.obj{position:absolute;transform-style:preserve-3d}
.desk{
  width:82px;height:52px;border-radius:8px;
  background:linear-gradient(180deg,#3a4050,#2f3442);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 14px 22px rgba(0,0,0,.4);
  transform:translate(-50%,-50%);
}
.desk .screen{
  position:absolute;left:50%;top:6px;transform:translateX(-50%);
  width:40px;height:24px;border-radius:3px;
  background:linear-gradient(180deg,#11202e,#0c161f);
  border:1px solid rgba(120,170,255,.25);
  box-shadow:0 0 10px rgba(90,150,255,.15);
}
.desk .screen.lit{animation:screenglow 1.1s infinite}
@keyframes screenglow{0%,100%{box-shadow:0 0 8px rgba(90,150,255,.2)}50%{box-shadow:0 0 16px rgba(120,200,255,.55)}}
.desk .label{
  position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--ink-mute);white-space:nowrap;
}
.table{
  width:150px;height:92px;border-radius:14px;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#39414f,#2c3340);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 22px 30px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.05);
}
.table .tlabel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:10px;color:var(--ink-mute);letter-spacing:.12em;
}
.plant{width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#7ad19a,#3f8f63);
  box-shadow:0 10px 14px rgba(0,0,0,.4), inset 0 -4px 6px rgba(0,0,0,.25)}
.board{
  width:120px;height:14px;transform:translate(-50%,-50%);border-radius:4px;
  background:linear-gradient(180deg,#e9ece6,#c9ccc4);
  box-shadow:0 12px 18px rgba(0,0,0,.4);
}
.board .btext{position:absolute;left:50%;top:-18px;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;color:var(--ink-mute);white-space:nowrap}

/* ============ AGENTS ============ */
.agent{
  position:absolute;width:0;height:0;
  transition:transform .05s linear;
  z-index:5;
}
.agent .body{
  position:absolute;left:0;top:0;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;
  transform-style:preserve-3d;
}
.avatar{
  position:relative;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  background:var(--col);
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 8px 14px rgba(0,0,0,.45), inset 0 -6px 10px rgba(0,0,0,.18);
  animation:bob 2.4s ease-in-out infinite;
}
.agent.walking .avatar{animation:walkbob .38s ease-in-out infinite}
.agent.working .avatar{animation:workshake .5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes walkbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes workshake{0%,100%{transform:translateY(0)}25%{transform:translateY(-1px) rotate(-2deg)}75%{transform:translateY(-1px) rotate(2deg)}}
.avatar .ring{
  position:absolute;inset:-5px;border-radius:50%;
  border:2px solid var(--col);opacity:0;
}
/* sprite (illustrated) agents — full-body chibi instead of emoji circle */
.avatar.sprite{
  width:auto;height:72px;border-radius:0;background:none;border:none;
  box-shadow:none;font-size:0;
}
.avatar.sprite img{height:72px;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.avatar.sprite img.mirror{transform:scaleX(-1)}
.avatar.sprite .ring{display:none}
.agent.working .avatar .ring{opacity:.9;animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.shadow{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotateX(60deg);
  width:34px;height:14px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);
  z-index:-1;
}
.nametag{
  margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:1px 7px;border-radius:999px;white-space:nowrap;
  background:rgba(10,12,18,.78);color:#fff;border:1px solid var(--col);
}
.nametag .role{display:block;font-size:8px;font-weight:500;color:var(--ink-mute);letter-spacing:.08em;text-align:center}
.nametag .model{color:var(--accent);font-family:var(--mono);font-weight:600}

/* progress bar over head while working */
.workbar{
  position:absolute;left:50%;top:-14px;transform:translateX(-50%);
  width:40px;height:5px;border-radius:3px;overflow:hidden;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);opacity:0;transition:opacity .25s;
}
.agent.working .workbar{opacity:1}
.workbar > i{display:block;height:100%;width:0%;background:var(--col);box-shadow:0 0 8px var(--col);transition:width .2s linear}

/* speech bubble */
.bubble{
  position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%) translateY(6px) scale(.9);
  max-width:190px;min-width:40px;
  padding:7px 11px;border-radius:12px;
  background:#fff;color:#1a1d26;font-size:12px;line-height:1.45;font-weight:500;
  box-shadow:0 10px 24px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  white-space:normal;text-align:left;
}
.bubble.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.bubble::after{
  content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:#fff;
}
.bubble.think{background:#e9edf6;font-style:italic;color:#4a5064}

/* emote (small floating icon) */
.emote{
  position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);
  font-size:18px;opacity:0;
}
.emote.pop{animation:emote 1.1s ease-out forwards}
@keyframes emote{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.5)}
  25%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.15)}
  100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.9)}}

/* ============ SIDE PANEL ============ */
.side{
  grid-area:side;
  display:flex;flex-direction:column;
  border-left:1px solid var(--line);
  background:linear-gradient(180deg,#14161f,#121420);
  min-height:0;
}
.side h2{
  font-size:11px;letter-spacing:.16em;color:var(--ink-mute);font-weight:700;
  padding:14px 16px 8px;text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
.roster{padding:0 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rcard{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
}
.rcard .chip{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--col);border:1.5px solid rgba(255,255,255,.7)}
.rcard .meta{min-width:0}
.rcard .meta b{display:block;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .meta span{display:block;font-size:9px;color:var(--ink-mute);font-family:var(--mono)}
.rcard .st{margin-left:auto;font-size:8px;font-family:var(--mono);color:var(--ink-mute);white-space:nowrap}
.rcard[data-busy="1"]{border-color:var(--col);box-shadow:0 0 0 1px var(--col) inset}
.rcard[data-busy="1"] .st{color:var(--accent)}

.log-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 6px;border-top:1px solid var(--line)}
.log-head h2{padding:0}
.log{
  flex:1;min-height:0;overflow-y:auto;
  padding:4px 12px 12px;display:flex;flex-direction:column;gap:7px;
  font-size:12px;line-height:1.5;
  scrollbar-width:thin;scrollbar-color:#333a4a transparent;
}
.log::-webkit-scrollbar{width:7px}
.log::-webkit-scrollbar-thumb{background:#333a4a;border-radius:4px}
.msg{display:flex;gap:8px;animation:slidein .25s ease}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .who{
  flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;background:var(--col);border:1.5px solid rgba(255,255,255,.6);
}
.msg .txt{background:var(--panel-2);padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.msg .txt b{color:var(--col);font-size:10px;display:block;margin-bottom:1px;font-weight:700}
.msg.sys .txt{background:transparent;border:none;color:var(--ink-mute);font-family:var(--mono);font-size:11px;padding:2px 0}
.msg.sys .who{display:none}
.msg.done .txt{border-color:var(--c-back)}

/* ============ COMMAND BAR ============ */
.cmdbar{
  position:absolute;left:0;right:0;bottom:0;
  padding:14px 16px 16px;
  background:linear-gradient(0deg,rgba(10,12,18,.92) 40%,transparent);
  display:flex;flex-direction:column;gap:8px;
  z-index:20;
}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{
  font-family:var(--sans);font-size:11px;color:var(--ink-soft);
  padding:5px 11px;border-radius:999px;cursor:pointer;
  background:rgba(30,34,48,.85);border:1px solid var(--line);transition:.15s;
}
.quick button:hover{border-color:var(--accent);color:#fff;transform:translateY(-1px)}
.cmd{display:flex;gap:8px}
.cmd input{
  flex:1;font-family:var(--sans);font-size:14px;color:var(--ink);
  padding:12px 16px;border-radius:12px;
  background:rgba(22,25,35,.95);border:1px solid var(--line);outline:none;transition:.15s;
}
.cmd input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,177,92,.15)}
.cmd input::placeholder{color:var(--ink-mute)}
.cmd button{
  font-family:var(--sans);font-weight:700;font-size:14px;color:#1a1d26;
  padding:0 22px;border-radius:12px;cursor:pointer;border:none;
  background:linear-gradient(180deg,#f0c877,var(--accent));
  box-shadow:0 8px 18px rgba(224,177,92,.3);transition:.15s;
}
.cmd button:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cmd button:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ============ DELIVERABLE MODAL ============ */
.deliver{
  position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,12,.72);backdrop-filter:blur(3px);
}
.deliver.show{display:flex;animation:slidein .3s}
.deliver .card{
  width:min(420px,86%);border-radius:18px;overflow:hidden;
  background:#fff;color:#1a1d26;box-shadow:0 40px 80px rgba(0,0,0,.6);
  transform:translateY(0);
}
.deliver .cap{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#12141d;color:#fff;font-family:var(--mono);font-size:12px}
.deliver .cap .g{color:var(--c-back)}
.deliver .cap button{margin-left:auto;background:none;border:none;color:#9aa2b5;font-size:20px;cursor:pointer;line-height:1}
.lp-preview{padding:0}
.lp-hero{padding:34px 26px;background:linear-gradient(135deg,#e0b15c,#c77b5a);color:#fff}
.lp-hero small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;opacity:.85}
.lp-hero h3{font-size:26px;font-weight:900;margin:8px 0 6px;line-height:1.2}
.lp-hero p{font-size:13px;opacity:.95;line-height:1.6}
.lp-hero .btns{margin-top:16px;display:flex;gap:8px}
.lp-hero .btns span{font-size:12px;font-weight:700;padding:8px 16px;border-radius:8px}
.lp-hero .btns .a{background:#fff;color:#c77b5a}
.lp-hero .btns .b{border:1px solid rgba(255,255,255,.7)}
.lp-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#e7e7ea}
.lp-body div{background:#fff;padding:16px 12px;text-align:center}
.lp-body div i{font-size:22px}
.lp-body div b{display:block;font-size:12px;margin-top:6px}
.lp-body div small{font-size:10px;color:#8a8f9c}
.lp-foot{padding:12px;text-align:center;font-family:var(--mono);font-size:11px;color:#9aa2b5;background:#f6f6f8}

.hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:15;
  font-family:var(--mono);font-size:11px;color:var(--ink-mute);
  background:rgba(18,20,29,.7);padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  transition:opacity .4s}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:52px 1fr 200px;
    grid-template-areas:"top" "stage" "side"}
  .side{border-left:none;border-top:1px solid var(--line)}
  .roster{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="brand"><span class="dot"></span>KAIDO&nbsp;STUDIO <small>AGENT OFFICE · POWERED BY CLAUDE OPUS</small></div>
    <div class="spacer"></div>
    <div class="status-pill" id="statusPill"><span class="beat"></span><span id="statusText">待機中 — 指示をどうぞ</span></div>
  </header>

  <!-- ===== STAGE ===== -->
  <div class="stage-wrap">
    <div class="hint" id="hint">下の入力欄に「LP作って」と打ってみてください ↓</div>
    <div class="stage">
      <div class="floor"></div>
      <div class="world" id="world"><!-- furniture & agents injected here --></div>
    </div>

    <!-- deliverable modal -->
    <div class="deliver" id="deliver">
      <div class="card">
        <div class="cap">📦 <span class="g">deliverable</span> — landing-page.html <button id="closeDeliver">×</button></div>
        <div class="lp-preview" id="lpPreview"></div>
      </div>
    </div>

    <!-- ===== COMMAND BAR ===== -->
    <div class="cmdbar">
      <div class="quick" id="quick"></div>
      <div class="cmd">
        <input id="cmdInput" type="text" placeholder="やってほしいことを入力（例：LP作って / バグ直して / 記事書いて）" autocomplete="off" />
        <button id="cmdSend">指示する</button>
      </div>
    </div>
  </div>

  <!-- ===== SIDE PANEL ===== -->
  <aside class="side">
    <h2>👥 チーム</h2>
    <div class="roster" id="roster"></div>
    <div class="log-head"><h2>💬 アクティビティ</h2></div>
    <div class="log" id="log"></div>
  </aside>
</div>

<script>
/* ============================================================
   KAIDO STUDIO — Agent office visualization
   Pure vanilla JS. Coordinates are in % of the world layer.
   ============================================================ */
const world = document.getElementById('world');
const logEl = document.getElementById('log');
const rosterEl = document.getElementById('roster');
const statusText = document.getElementById('statusText');
const statusPill = document.getElementById('statusPill');
const hintEl = document.getElementById('hint');

/* ---- team definition ---- */
const TEAM = [
  {id:'pm',    name:'マネジャー', role:'PM',        emoji:'🧑‍💼', color:'var(--c-pm)',     desk:{x:50,y:16}},
  {id:'design',name:'アオイ',     role:'Designer',  emoji:'🎨', color:'var(--c-design)', desk:{x:20,y:32}},
  {id:'front', name:'リク',       role:'Frontend',  emoji:'💻', color:'var(--c-front)',  desk:{x:20,y:66},
   sprite:'assets/images/agents/riku'},
  {id:'back',  name:'ハル',       role:'Backend',   emoji:'⚙️', color:'var(--c-back)',   desk:{x:80,y:32}},
  {id:'write', name:'ナギ',       role:'Writer',    emoji:'✍️', color:'var(--c-write)',  desk:{x:80,y:66}},
  {id:'qa',    name:'ソウ',       role:'QA',        emoji:'🔍', color:'var(--c-qa)',     desk:{x:50,y:80}},
];
const MEETING = {x:50, y:46};      // table center
const byId = {};

/* ---- furniture layout ---- */
const FURNITURE = [
  {type:'table', x:50, y:46, label:'MEETING'},
  {type:'board', x:50, y:30, text:'📋 SPRINT BOARD'},
  {type:'plant', x:9,  y:14},
  {type:'plant', x:91, y:14},
  {type:'plant', x:9,  y:86},
  {type:'plant', x:91, y:86},
];

/* ============ build world ============ */
function buildFurniture(){
  FURNITURE.forEach(f=>{
    const el = document.createElement('div');
    el.className = 'obj';
    el.style.left = f.x+'%'; el.style.top = f.y+'%';
    if(f.type==='table'){
      const t=document.createElement('div'); t.className='table';
      t.innerHTML='<div class="tlabel">'+(f.label||'')+'</div>'; el.appendChild(t);
    }else if(f.type==='board'){
      const b=document.createElement('div'); b.className='board';
      b.innerHTML='<div class="btext">'+(f.text||'')+'</div>'; el.appendChild(b);
    }else if(f.type==='plant'){
      const p=document.createElement('div'); p.className='plant'; el.appendChild(p);
    }
    world.appendChild(el);
  });
  // desks
  TEAM.forEach(a=>{
    const el=document.createElement('div'); el.className='obj';
    el.style.left=a.desk.x+'%'; el.style.top=(a.desk.y+8)+'%';
    const d=document.createElement('div'); d.className='desk';
    d.innerHTML='<div class="screen" id="screen-'+a.id+'"></div><div class="label">'+a.role+'</div>';
    el.appendChild(d); world.appendChild(el);
  });
}

/* ============ Agent class ============ */
class Agent{
  constructor(def){
    Object.assign(this,def);
    this.x = def.desk.x; this.y = def.desk.y;
    this.tx = this.x; this.ty = this.y;
    this.state='idle';
    this._arriveRes=null;
    this.build();
    byId[this.id]=this;
  }
  build(){
    const el=document.createElement('div');
    el.className='agent'; el.id='agent-'+this.id;
    el.style.setProperty('--col', this.color);
    const avatar = this.sprite
      ? `<div class="avatar sprite"><span class="ring"></span><img src="${this.sprite}-front.png" alt="${this.name}"></div>`
      : `<div class="avatar"><span class="ring"></span>${this.emoji}</div>`;
    el.innerHTML=`
      <div class="shadow"></div>
      <div class="body">
        <div class="workbar"><i></i></div>
        <div class="emote"></div>
        <div class="bubble"></div>
        ${avatar}
        <div class="nametag">${this.name}<span class="role">${this.role} · <span class="model">opus</span></span></div>
      </div>`;
    world.appendChild(el);
    this.el=el;
    if(this.sprite){
      this.sprImg=el.querySelector('.avatar img');
      this.el.querySelector('.shadow').style.display='none'; // sprite has baked shadow
      this._sprKey='front:0';
      // preload all directions
      ['front','back','left','right','front45','back45']
        .forEach(v=>{ const i=new Image(); i.src=this.sprite+'-'+v+'.png'; });
    }
    this.bubbleEl=el.querySelector('.bubble');
    this.emoteEl=el.querySelector('.emote');
    this.workFill=el.querySelector('.workbar > i');
    this.screen=document.getElementById('screen-'+this.id);
    this.place();
  }
  place(){ this.el.style.left=this.x+'%'; this.el.style.top=this.y+'%';
    // depth sort — lower on floor = in front
    this.el.style.zIndex = 5 + Math.round(this.y);
  }
  setState(s){
    this.state=s;
    this.el.classList.toggle('walking', s==='walking');
    this.el.classList.toggle('working', s==='working');
    if(this.screen) this.screen.classList.toggle('lit', s==='working');
    const card=this.card; if(card){ card.dataset.busy = (s==='idle')?'0':'1';
      card.querySelector('.st').textContent = STLABEL[s]||''; }
  }
  moveTo(x,y){
    this.tx=x; this.ty=y;
    this.setState('walking');
    return new Promise(res=>{ this._arriveRes=res; });
  }
  toDesk(){ return this.moveTo(this.desk.x, this.desk.y); }
  tick(dt){
    const dx=this.tx-this.x, dy=this.ty-this.y;
    const dist=Math.hypot(dx,dy);
    if(dist<0.4){
      if(this.state==='walking'){
        this.x=this.tx; this.y=this.ty; this.place();
        this.setState('idle');
        this.faceFront();
        if(this._arriveRes){ const r=this._arriveRes; this._arriveRes=null; r(); }
      }
      return;
    }
    const speed = 26; // % per second
    const step = Math.min(dist, speed*dt);
    this.x += dx/dist*step;
    this.y += dy/dist*step;
    this.place();
    if(this.sprImg) this.updateSpriteDir(dx,dy);
  }
  /* pick sprite view from movement direction (8 sectors, diagonals mirror the 45° art) */
  updateSpriteDir(dx,dy){
    const deg=Math.atan2(dy,dx)*180/Math.PI; // 0=右 90=下(手前) -90=上(奥)
    let view, mirror=0;
    if(deg>-22.5&&deg<=22.5){ view='right'; }
    else if(deg>22.5&&deg<=67.5){ view='front45'; mirror=1; }   // 手前右 (原画は左向き)
    else if(deg>67.5&&deg<=112.5){ view='front'; }
    else if(deg>112.5&&deg<=157.5){ view='front45'; }           // 手前左
    else if(deg>157.5||deg<=-157.5){ view='left'; }
    else if(deg>-157.5&&deg<=-112.5){ view='back45'; }          // 奥左 (原画は左肩越し)
    else if(deg>-112.5&&deg<=-67.5){ view='back'; }
    else { view='back45'; mirror=1; }                           // 奥右
    this.setSprite(view,mirror);
  }
  faceFront(){ if(this.sprImg) this.setSprite('front',0); }
  setSprite(view,mirror){
    const key=view+':'+mirror;
    if(key===this._sprKey) return;
    this._sprKey=key;
    this.sprImg.src=this.sprite+'-'+view+'.png';
    this.sprImg.classList.toggle('mirror',!!mirror);
  }
  say(text, opts={}){
    const b=this.bubbleEl;
    b.textContent=text;
    b.classList.toggle('think', !!opts.think);
    b.classList.add('show');
    clearTimeout(this._bt);
    const dur = opts.dur || Math.max(1600, text.length*90);
    this._bt=setTimeout(()=>b.classList.remove('show'), dur);
    if(opts.log!==false) addMsg(this.id, text, opts.think);
  }
  emote(icon){
    this.emoteEl.textContent=icon;
    this.emoteEl.classList.remove('pop'); void this.emoteEl.offsetWidth;
    this.emoteEl.classList.add('pop');
  }
  async work(ms){
    this.setState('working');
    this.workFill.style.width='0%';
    const start=performance.now();
    await new Promise(res=>{
      const step=(t)=>{
        const p=Math.min(1,(t-start)/ms);
        this.workFill.style.width=(p*100)+'%';
        if(p<1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    this.setState('idle');
  }
}
const STLABEL={idle:'待機',walking:'移動中',working:'作業中'};

/* ============ main loop ============ */
let last=performance.now();
function loop(now){

/* ambient idle behaviour: wander & small talk when no job running */
let jobRunning=false;
const SMALLTALK=[
  ['front','ここのCSS、grid使うと楽だよ'],['design','配色もう少し温かくしたいな'],
  ['back','APIのレスポンス速くなった⚡'],['write','見出しの語感、練り直そ'],
  ['qa','エッジケース見つけた👀'],['pm','今日の進捗いい感じ！'],
  ['design','余白は正義'],['front','リファクタしたらスッキリした'],
  ['back','キャッシュ効いてる'],['write','てにをは大事'],
];
async function ambientStep(){
  if(jobRunning) return;
  const a = byId[TEAM[Math.floor(Math.random()*TEAM.length)].id];
  if(a.state!=='idle') return;
  const roll=Math.random();
  if(roll<0.45){
    // wander near own desk
    const nx=clamp(a.desk.x+(Math.random()*20-10), 10, 90);
    const ny=clamp(a.desk.y+(Math.random()*14-7), 12, 84);
    await a.moveTo(nx,ny); await sleep(600+Math.random()*800);
    if(!jobRunning && a.state==='idle') a.toDesk();
  }else if(roll<0.7){
    a.emote(['💭','☕','✨','🎧','📎'][Math.floor(Math.random()*5)]);
  }else{
    const line=SMALLTALK[Math.floor(Math.random()*SMALLTALK.length)];
    if(line[0]===a.id) a.say(line[1],{dur:2200});
  }
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
setInterval(ambientStep, 2200);

/* offset so multiple agents around the table don't overlap */
function seatAround(center, i, n, r=18){
  const ang = (-90 + i*(360/n)) * Math.PI/180;
  return { x: clamp(center.x + Math.cos(ang)*r, 8,92),
           y: clamp(center.y + Math.sin(ang)*r*0.62, 12,84) };
}

function extractTitle(t){
  const DEFAULT='暮らすように、泊まる。';
  if(!t) return DEFAULT;
  const cleaned=t.replace(/(を|の|で)?\s*(作って|つくって|お願い|ください|して|欲しい|ほしい).*/,'').trim();
  // "LP" や "ページ" 等、素っ気ない語だけならデフォルト見出しを使う
  if(/^(lp|ランディング|ランディングページ|ページ|サイト|ホームページ)$/i.test(cleaned)) return DEFAULT;
  return cleaned.length>1 && cleaned.length<24 ? cleaned : DEFAULT;
}
